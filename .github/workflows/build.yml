name: Build ImanAccount

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════
  # Build 32-bit OneFile + Installer
  # ═══════════════════════════════════════════════════════════
  build-32bit:
    name: Build 32-bit + Installer
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python 3.8 32-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==5.13.2
          python -m pip install PyQt5==5.15.9
          python -m pip install PyQtChart==5.15.6
          python -m pip install persiantools==4.0.0
          python -m pip install reportlab==3.6.13
          python -m pip install bcrypt==4.0.1
          python -m pip install arabic-reshaper==3.0.0
          python -m pip install python-bidi==0.4.2
          python -m pip install cryptography==3.4.8
          python -m pip install pillow==9.5.0
          python -m pip install requests==2.31.0
      
      - name: 🏗️ Build OneFile
        run: |
          python -m PyInstaller --onefile --windowed --icon=Icon.ico --name=ImanAccount --add-data="fonts;fonts" --add-data="Icon.ico;." --collect-all PyQt5 --collect-all PyQtChart --hidden-import=PyQt5.QtPrintSupport --hidden-import=PyQt5.QtChart --hidden-import=PyQt5.QtSvg --hidden-import=PyQt5.QtXml --hidden-import=PyQt5.QtNetwork --hidden-import=PyQt5.sip --hidden-import=persiantools --hidden-import=reportlab --hidden-import=bcrypt --hidden-import=arabic_reshaper --hidden-import=bidi --hidden-import=cryptography --hidden-import=cryptography.hazmat --hidden-import=cryptography.hazmat.backends --hidden-import=cryptography.hazmat.backends.openssl --hidden-import=PIL --hidden-import=requests --hidden-import=license_core --hidden-import=registry_guard --hidden-import=database --hidden-import=security --noupx --clean --noconfirm main2.py
      
      - name: 📤 Upload OneFile
        uses: actions/upload-artifact@v4
        with:
          name: ImanAccount-OneFile-32bit
          path: dist/ImanAccount.exe
          retention-days: 30
      
      - name: 📦 Install Inno Setup
        run: choco install innosetup -y
      
      - name: 🏗️ Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      
      - name: 📤 Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: ImanAccount-Installer-32bit
          path: installer_output/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════
  # Build 64-bit OneFile + Installer
  # ═══════════════════════════════════════════════════════════
  build-64bit:
    name: Build 64-bit + Installer
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python 3.8 64-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x64'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==5.13.2
          python -m pip install PyQt5==5.15.9
          python -m pip install PyQtChart==5.15.6
          python -m pip install persiantools==4.0.0
          python -m pip install reportlab==3.6.13
          python -m pip install bcrypt==4.0.1
          python -m pip install arabic-reshaper==3.0.0
          python -m pip install python-bidi==0.4.2
          python -m pip install cryptography==3.4.8
          python -m pip install pillow==9.5.0
          python -m pip install requests==2.31.0
      
      - name: 🏗️ Build OneFile
        run: |
          python -m PyInstaller --onefile --windowed --icon=Icon.ico --name=ImanAccount --add-data="fonts;fonts" --add-data="Icon.ico;." --collect-all PyQt5 --collect-all PyQtChart --hidden-import=PyQt5.QtPrintSupport --hidden-import=PyQt5.QtChart --hidden-import=PyQt5.QtSvg --hidden-import=PyQt5.QtXml --hidden-import=PyQt5.QtNetwork --hidden-import=PyQt5.sip --hidden-import=persiantools --hidden-import=reportlab --hidden-import=bcrypt --hidden-import=arabic_reshaper --hidden-import=bidi --hidden-import=cryptography --hidden-import=cryptography.hazmat --hidden-import=cryptography.hazmat.backends --hidden-import=cryptography.hazmat.backends.openssl --hidden-import=PIL --hidden-import=requests --hidden-import=license_core --hidden-import=registry_guard --hidden-import=database --hidden-import=security --noupx --clean --noconfirm main2.py
      
      - name: 📤 Upload OneFile
        uses: actions/upload-artifact@v4
        with:
          name: ImanAccount-OneFile-64bit
          path: dist/ImanAccount.exe
          retention-days: 30
      
      - name: 📦 Install Inno Setup
        run: choco install innosetup -y
      
      - name: 🏗️ Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      
      - name: 📤 Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: ImanAccount-Installer-64bit
          path: installer_output/
          retention-days: 30