name: Build ImanAccount

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ???????????????????????????????????????????????????????????
  # Build 32-bit + Installer
  # ???????????????????????????????????????????????????????????
  build-32bit:
    name: Build 32-bit + Installer
    runs-on: windows-latest
    
    steps:
      - name: ?? Checkout code
        uses: actions/checkout@v4
      
      - name: ?? Setup Python 3.8 32-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'
      
      - name: ?? Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==5.13.2
          python -m pip install PyQt5==5.15.9
          python -m pip install persiantools reportlab bcrypt
          python -m pip install arabic-reshaper python-bidi cryptography
          python -m pip install pillow requests
      
      - name: ??? Build with PyInstaller
        run: |
          python -m PyInstaller --onedir --windowed --icon=Icon.ico --name=ImanAccount --add-data="fonts;fonts" --add-data="Icon.ico;." --hidden-import=PyQt5.QtPrintSupport --hidden-import=PyQt5.QtChart --hidden-import=persiantools --hidden-import=reportlab --hidden-import=bcrypt --hidden-import=arabic_reshaper --hidden-import=bidi --hidden-import=cryptography --hidden-import=PIL --hidden-import=requests --hidden-import=license_core --hidden-import=registry_guard --hidden-import=database --hidden-import=security --noupx --clean --noconfirm main2.py
      
      - name: ?? Upload Portable App (32-bit)
        uses: actions/upload-artifact@v4
        with:
          name: ImanAccount-Portable-32bit
          path: dist/ImanAccount/
          retention-days: 30
      
      - name: ?? Install Inno Setup
        run: choco install innosetup -y
      
      - name: ??? Build Installer (32-bit)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      
      - name: ?? Upload Installer (32-bit)
        uses: actions/upload-artifact@v4
        with:
          name: ImanAccount-Installer-32bit
          path: installer_output/
          retention-days: 30

  # ???????????????????????????????????????????????????????????
  # Build 64-bit + Installer
  # ???????????????????????????????????????????????????????????
  build-64bit:
    name: Build 64-bit + Installer
    runs-on: windows-latest
    
    steps:
      - name: ?? Checkout code
        uses: actions/checkout@v4
      
      - name: ?? Setup Python 3.8 64-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x64'
      
      - name: ?? Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==5.13.2
          python -m pip install PyQt5==5.15.9
          python -m pip install persiantools reportlab bcrypt
          python -m pip install arabic-reshaper python-bidi cryptography
          python -m pip install pillow requests
      
      - name: ??? Build with PyInstaller
        run: |
          python -m PyInstaller --onedir --windowed --icon=Icon.ico --name=ImanAccount --add-data="fonts;fonts" --add-data="Icon.ico;." --hidden-import=PyQt5.QtPrintSupport --hidden-import=PyQt5.QtChart --hidden-import=persiantools --hidden-import=reportlab --hidden-import=bcrypt --hidden-import=arabic_reshaper --hidden-import=bidi --hidden-import=cryptography --hidden-import=PIL --hidden-import=requests --hidden-import=license_core --hidden-import=registry_guard --hidden-import=database --hidden-import=security --noupx --clean --noconfirm main2.py
      
      - name: ?? Upload Portable App (64-bit)
        uses: actions/upload-artifact@v4
        with:
          name: ImanAccount-Portable-64bit
          path: dist/ImanAccount/
          retention-days: 30
      
      - name: ?? Install Inno Setup
        run: choco install innosetup -y
      
      - name: ??? Build Installer (64-bit)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      
      - name: ?? Upload Installer (64-bit)
        uses: actions/upload-artifact@v4
        with:
          name: ImanAccount-Installer-64bit
          path: installer_output/
          retention-days: 30