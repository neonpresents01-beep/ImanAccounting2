name: Build ImanAccount

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-32bit:
    name: Build Windows 32-bit
    runs-on: windows-latest
    
    steps:
      - name: ?? Checkout code
        uses: actions/checkout@v4
      
      - name: ?? Setup Python 3.8 32-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x86'
      
      - name: ?? Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==5.13.2
          python -m pip install PyQt5==5.15.9
          python -m pip install persiantools reportlab bcrypt
          python -m pip install arabic-reshaper python-bidi cryptography
          python -m pip install pillow requests
      
      - name: ??? Build with PyInstaller
        run: |
          python -m PyInstaller --onedir --windowed --icon=Icon.ico --name=ImanAccount --add-data="fonts;fonts" --add-data="Icon.ico;." --hidden-import=PyQt5.QtPrintSupport --hidden-import=PyQt5.QtChart --hidden-import=persiantools --hidden-import=reportlab --hidden-import=bcrypt --hidden-import=arabic_reshaper --hidden-import=bidi --hidden-import=cryptography --hidden-import=PIL --hidden-import=requests --hidden-import=license_core --hidden-import=registry_guard --hidden-import=database --hidden-import=security --noupx --clean --noconfirm main2.py
      
      - name: ?? Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImanAccount-Windows-32bit
          path: dist/ImanAccount/
          retention-days: 30